# Nginx Reverse Proxy konfiguratsiyasi (Streamlit WebSocket qo'llab-quvvatlashi bilan)
# Fayl manzili: /etc/nginx/sites-available/bitcoin-dashboard

server {
    listen 80;
    server_name _; # O'zingizning domeningizni yoki server IP manzilini yozing

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit WebSockets sozlamalari
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
